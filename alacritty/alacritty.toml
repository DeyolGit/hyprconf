
# ==========================================
# EVERFOREST DARK MEDIUM
# ==========================================

[window]
opacity = 0.6
blur = true
padding = { x = 12, y = 12 }
dynamic_padding = true
decorations = "Full"

[scrolling]
history = 10000
multiplier = 3

# ==========================================
# FONT
# ==========================================

[font]
size = 12.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

# ==========================================
# CURSOR
# ==========================================

[cursor]
blink_interval = 550
unfocused_hollow = true

[cursor.style]
shape = "Block"
blinking = "On"

# ==========================================
# EVERFOREST COLORS
# ==========================================

[colors.primary]
background = "#30393e"
foreground = "#d3c6aa"

[colors.normal]
black   = "#475258"
red     = "#e67e80"
green   = "#a7c080"
yellow  = "#dbbc7f"
blue    = "#7fbbb3"
magenta = "#d699b6"
cyan    = "#83c092"
white   = "#d3c6aa"

[colors.bright]
black   = "#475258"
red     = "#e67e80"
green   = "#a7c080"
yellow  = "#dbbc7f"
blue    = "#7fbbb3"
magenta = "#d699b6"
cyan    = "#83c092"
white   = "#d3c6aa"

[colors.cursor]
text = "#2d353b"
cursor = "#a7c080"

[colors.selection]
text = "#d3c6aa"
background = "#475258"

# ==========================================
# MOUSE & BELL
# ==========================================

[mouse]
hide_when_typing = true

[bell]
animation = "EaseOutExpo"
duration = 150
color = "#a7c080"

# ==========================================
# ENVIRONMENT
# ==========================================

[env]
TERM = "xterm-256color"

